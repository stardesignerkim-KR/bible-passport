<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible and Me — 말씀의 발자취</title>
  <meta name="description" content="66개 말씀(책)와 1,189걸음(장)을 한눈에. 오늘 내 위치와 도장을 확인하세요.">
  <meta name="theme-color" content="#FFF8EC">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bible and Me">
  <meta property="og:title" content="Bible and Me — 말씀의 발자취">
  <meta property="og:description" content="66개 말씀과 1,189걸음을 한눈에. 오늘 내 위치와 도장을 확인하세요.">
  <meta property="og:url" content="https://bibleandme.vercel.app/map">
  <meta property="og:image" content="https://bibleandme.vercel.app/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <main class="wrap">
    <section class="hero compact">
      <span class="pill" id="locPill">내 위치</span>
      <h1>말씀의 발자취 <small>요한계시록 → 창세기</small></h1>
      <p class="sub" id="locSub"></p>
    </section>

    <section class="card" aria-label="전체 지도">
      <div class="card-head"><h2>한눈에 보기</h2><span class="hint">말씀을 누르면 해당 말씀으로 이동해요</span></div>
      <div id="stats"></div>
      <div class="journey" id="journey"></div>
      <div class="legend">
        <span><i class="lg here"></i>오늘 위치</span>
        <span><i class="lg done"></i>말씀 도착</span>
        <span><i class="lg full"></i>완주</span>
      </div>
    </section>

    <div id="cities"></div>
  </main>
  <button class="fab" id="btnHere" hidden>내 위치로</button>
  <div id="app-footer"></div>
  <script type="module" src="js/map.js"></script>
</body>
</html>
